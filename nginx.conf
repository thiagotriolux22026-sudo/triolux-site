server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/seguranca.conf;

    # a página muda quando você atualiza o site: sempre confere com o servidor
    location = /index.html {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # fotos e ícones quase nunca mudam: ficam 30 dias no navegador
    location /img/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
